<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 주식 투자 게임</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>📈 가상 주식 투자 게임</h1>

  <!-- 시작 화면 -->
  <section id="start" class="card">
    <p>10개 종목 · 시작 자금 1,000,000원 · 총 5턴. 모든 턴이 끝나면 전 종목이 자동 매도되고 순위가 저장됩니다.</p>
    <input type="text" id="name" placeholder="플레이어 이름" maxlength="20">
    <button id="startBtn">게임 시작</button>
    <div id="startMsg" class="msg"></div>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="hidden">
    <div class="card stats">
      <div class="stat"><small>플레이어</small><b id="sName"></b></div>
      <div class="stat"><small>턴</small><b id="sTurn"></b></div>
      <div class="stat"><small>보유 현금</small><b id="sCash"></b></div>
      <div class="stat"><small>총 자산</small><b id="sTotal"></b></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>종목</th><th>현재가</th><th>전 턴 대비</th><th>보유 수량</th><th>평가금액</th></tr></thead>
        <tbody id="stockBody"></tbody>
      </table>
      <div class="actions">
        <span id="selLabel" class="muted">종목을 선택하세요</span>
        <input type="number" id="qty" min="1" value="1">
        <button class="buy" id="buyBtn">매수</button>
        <button class="sell" id="sellBtn">매도</button>
        <span class="sp"></span>
        <button class="end" id="endBtn">턴 종료</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  </section>

  <!-- 시세 그래프 -->
  <div class="card hidden" id="chartCard">
    <b>📊 시세 그래프</b> <small class="muted">(종목을 선택하면 강조됩니다)</small>
    <svg id="chart" viewBox="0 0 800 320"></svg>
    <div id="legend"></div>
  </div>

  <!-- 랭킹 -->
  <section class="card">
    <b>🏆 랭킹 (최종 금액 순)</b>
    <table>
      <thead><tr><th>순위</th><th>이름</th><th>최종 금액</th><th>손익</th><th>일시</th></tr></thead>
      <tbody id="rankBody"></tbody>
    </table>
  </section>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
